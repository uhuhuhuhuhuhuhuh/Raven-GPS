apply plugin: 'com.android.application'

android {
    namespace = "io.github.uhuhuhuhuhuhuhuh.ravengps"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.uhuhuhuhuhuhuhuh.ravengps"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes the run number, so each build installs over the previous one.
        versionCode((System.getenv("RAVEN_VERSION_CODE") ?: "1").toInteger())
        versionName(System.getenv("RAVEN_VERSION_NAME") ?: "1.0.0-dev")
        // Spotify's auth library declares its redirect activity with these placeholders; they
        // have to match the redirect URI registered for the client ID (ravengps://callback).
        manifestPlaceholders = [redirectSchemeName: "ravengps", redirectHostName: "callback"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Release signing key from CI secrets; without them the preview key below is used.
        release {
            def keystore = System.getenv("RAVEN_KEYSTORE")
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv("RAVEN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RAVEN_KEY_ALIAS")
                keyPassword System.getenv("RAVEN_KEY_PASSWORD")
            }
        }
        // Fixed key, committed on purpose, for preview/sideload builds. Gradle's debug key is
        // generated per machine, so every CI build came out with a different signature and
        // Android refused to install one build over the last ("signatures do not match"),
        // which also broke the in-app updater. This key is not a secret: it only has to be
        // stable. Real releases still come from the secrets above.
        preview {
            storeFile file("preview.keystore")
            storePassword "ravenpreview"
            keyAlias "ravenpreview"
            keyPassword "ravenpreview"
        }
    }
    buildTypes {
        release {
            signingConfig System.getenv("RAVEN_KEYSTORE") ? signingConfigs.release : signingConfigs.preview
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Spotify App Remote: Spotify does not publish this to Maven, so the .aar from their
    // GitHub release is vendored in libs/ and picked up by the flatDir repository above.
    // Needed because Spotify's MediaBrowserService refuses to serve a library to callers it
    // hasn't allow-listed, which is every app that isn't Android Auto or a named partner.
    implementation(name: 'spotify-app-remote-release-0.8.0', ext: 'aar')
    // Auth library: App Remote only reports "explicit user authorization is required"; the
    // consent flow itself lives here and has to be run once before it will connect.
    implementation(name: 'spotify-auth-release-2.1.0', ext: 'aar')
    implementation "com.google.code.gson:gson:2.10.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
